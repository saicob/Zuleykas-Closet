<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css">
  <title>Login</title>
  <style>
    .login-card{max-width:420px;margin:120px auto;padding:28px;background:white;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.06)}
    .login-card h2{color:var(--accent);margin-bottom:14px}
    .form-group{margin-bottom:12px}
    input[type=text],input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e6e6}
  </style>
</head>
<body>
  <main>
    <div class="login-card">
      <h2>Sistema de autenticación eliminado</h2>
      <p>Has eliminado el sistema de usuarios. Regresa al <a href="/">inicio</a> para continuar.</p>
    </div>
  </main>
</body>
</html>
