<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css">
  <title>Iniciar sesión - Zuleykas Closet</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--accent:#dd9cba;--muted:#6b7280}
    body{background:var(--bg);font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;margin:0;padding:0;color:#111}
    .login-wrapper{max-width:420px;margin:80px auto;padding:24px;background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,0.06)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .brand .logo{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),#dd9cba);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    h1{font-size:20px;margin:0 0 8px}
    p.lead{margin:0 0 18px;color:var(--muted);font-size:14px}
    form{display:block}
    label{display:block;font-size:13px;margin-bottom:6px;color:#111}
    input[type="text"],input[type="password"],input[type="email"]{width:100%;padding:10px 12px;border:1px solid #e6e6e6;border-radius:10px;background:#fff;box-sizing:border-box;font-size:14px}
    .field{margin-bottom:12px}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
    .checkbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
    button[type="submit"]{background:var(--accent);color:white;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
    .links{margin-top:14px;display:flex;justify-content:space-between;font-size:13px}
    .links a{color:var(--accent);text-decoration:none}
    .small{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
    @media (max-width:480px){.login-wrapper{margin:28px 16px;padding:18px}}
  </style>
</head>
<body>
  <main class="login-wrapper" role="main">
    <div class="brand">
      <div class="logo" aria-hidden="true">ZC</div>
      <div>
        <h1>Iniciar sesión</h1>
        <p class="lead">Accede a tu cuenta para administrar la tienda.</p>
      </div>
    </div>

    <!-- Form sin funcionalidad por ahora -->
    <form action="#" method="post" novalidate>
      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input id="username" name="username" type="text" placeholder="Tu nombre de usuario" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required>
      </div>

      <div class="actions">
        <button id="loginBtn" type="submit">Iniciar sesión</button>
      </div>


    
    </form>
  </main>

  <script>
    // Listener bound to the login button. Prevents default form submit
    // and performs a simple string comparison for credentials.
    (function() {
      const btn = document.getElementById('loginBtn');
      if (!btn) return;
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const username = document.getElementById('username')?.value || '';
        const password = document.getElementById('password')?.value || '';
        if (username === 'ADMIN' && password === '123') {
          // Redirect to VerProductos.html in the same templates folder
          window.location.href = 'Rentabilidad.html';
        } else {
          alert('Credenciales incorrectas.');
        }
      });
    })();
  </script>

</body>
</html>
