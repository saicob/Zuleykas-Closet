<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css">
  <title>Administrar Usuarios</title>
  <style>
    .users-card{max-width:900px;margin:100px auto;padding:20px;background:white;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
    .form-inline{display:flex;gap:8px;align-items:center}
    .form-inline input, .form-inline select{padding:8px;border-radius:8px;border:1px solid #e6e6e6}
  </style>
</head>
<body>
  <div class="users-card">
    <h2>Sistema de Usuarios eliminado</h2>
    <p>Has eliminado el sistema de usuarios. Reimplementa la funcionalidad desde cero cuando estés listo.</p>
  </div>
</body>
</html>
